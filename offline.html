<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>deckdrill — offline</title>
<style>
  :root { color-scheme: light dark; --paper: #e7ece4; --ink: #1e2a2b; --ink-2: #3c4a49; --pine: #2e5b4f; --pine-ink: #f3f6f1; }
  @media (prefers-color-scheme: dark) { :root { --paper: #141a1a; --ink: #e2e8e0; --ink-2: #c3ccc4; --pine: #7fb6a3; --pine-ink: #10201b; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 16px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 26rem; padding: 24px; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { color: var(--ink-2); margin: 0 0 1.25rem; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: .6rem 1.1rem; background: var(--pine); color: var(--pine-ink); cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Can't reach deckdrill</h1>
  <p>The studio runs on www.deckdrill.app, so it needs an internet connection. Drills you've already rendered are still cached and will load again once you're back online.</p>
  <button type="button" id="retry">Try again</button>
</main>
<script>
  const next = new URLSearchParams(location.search).get("next");
  document.getElementById("retry").addEventListener("click", () => {
    location.href = next && /^https:\/\/(www\.)?deckdrill\.app(\/|$)/.test(next) ? next : "https://www.deckdrill.app";
  });
</script>
</body>
</html>
